<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CoverTheMap logo">
  <title>CoverTheMap</title>
  <!-- street grid -->
  <g stroke="#9a9a92" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M20 8V92M50 8V92M80 8V92M8 20H92M8 50H92M8 80H92"/>
  </g>
  <!-- route covering the streets in a serpentine -->
  <path d="M20 20H80V50H20V80H80" fill="none" stroke="#1D9E75" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- start and end -->
  <circle cx="20" cy="20" r="8" fill="#D85A30"/>
  <circle cx="80" cy="80" r="8" fill="#7F77DD"/>
</svg>
